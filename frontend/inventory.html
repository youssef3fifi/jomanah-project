<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management - Pharmacy System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <h1>⚕️ PharmaCare System</h1>
                <p>Professional Pharmacy Management</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="inventory.html">Inventory</a></li>
                    <li><a href="sales.html">Sales</a></li>
                    <li><a href="customers.html">Customers</a></li>
                    <li><a href="reports.html">Reports</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Inventory Management</h2>
                <button class="btn btn-primary" onclick="openAddModal()">➕ Add Medicine</button>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" class="form-control" 
                           placeholder="Search medicines by name, category, or supplier...">
                </div>
                <select id="categoryFilter" class="form-control" style="width: 200px;">
                    <option value="">All Categories</option>
                </select>
                <button class="btn btn-secondary" onclick="toggleLowStock()">
                    ⚠️ Low Stock Only
                </button>
            </div>

            <!-- Medicines Table -->
            <div class="table-container" id="medicinesContainer">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer"></div>
        </div>
    </main>

    <!-- Add/Edit Medicine Modal -->
    <div id="medicineModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add Medicine</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="medicineForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="medicineId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Medicine Name *</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" class="form-control" 
                               placeholder="e.g., Antibiotics, Pain Relief">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Price ($) *</label>
                        <input type="number" id="price" class="form-control" 
                               step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="stock_quantity">Stock Quantity *</label>
                        <input type="number" id="stock_quantity" class="form-control" 
                               min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input type="date" id="expiry_date" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="supplier">Supplier</label>
                        <input type="text" id="supplier" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" rows="3"></textarea>
                </div>

                <div class="flex-between" style="margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save Medicine</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
