<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management - Pharmacy System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <h1>⚕️ PharmaCare System</h1>
                <p>Professional Pharmacy Management</p>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="inventory.html">Inventory</a></li>
                    <li><a href="sales.html">Sales</a></li>
                    <li><a href="customers.html">Customers</a></li>
                    <li><a href="reports.html">Reports</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- New Sale Card -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">🛒 New Sale</h2>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="customerSelect">Customer (Optional)</label>
                    <select id="customerSelect" class="form-control">
                        <option value="">Walk-in Customer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="paymentMethod">Payment Method *</label>
                    <select id="paymentMethod" class="form-control" required>
                        <option value="cash">Cash</option>
                        <option value="card">Card</option>
                        <option value="insurance">Insurance</option>
                    </select>
                </div>
            </div>

            <!-- Add Item Section -->
            <div style="background: #f5f5f5; padding: 1rem; border-radius: 5px; margin-bottom: 1rem;">
                <h4>Add Items to Sale</h4>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label for="medicineSelect">Medicine</label>
                        <select id="medicineSelect" class="form-control">
                            <option value="">Select a medicine...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" class="form-control" 
                               min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary" onclick="addItemToCart()" style="width: 100%;">
                            ➕ Add Item
                        </button>
                    </div>
                </div>
            </div>

            <!-- Cart Items -->
            <div id="cartContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">🛒</div>
                    <p>No items in cart. Add medicines to create a sale.</p>
                </div>
            </div>

            <!-- Total and Submit -->
            <div id="cartSummary" class="hidden">
                <div style="background: var(--primary-color); color: white; padding: 1.5rem; border-radius: 5px; margin-top: 1rem;">
                    <div class="flex-between">
                        <h3>Total Amount:</h3>
                        <h2 id="totalAmount">$0.00</h2>
                    </div>
                </div>
                <div class="flex-between" style="margin-top: 1rem;">
                    <button class="btn btn-secondary" onclick="clearCart()">Clear Cart</button>
                    <button class="btn btn-success" onclick="processSale()" id="processSaleBtn">
                        💰 Process Sale
                    </button>
                </div>
            </div>
        </div>

        <!-- Sales History -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Sales History</h2>
                <button class="btn btn-primary btn-sm" onclick="loadSales()">🔄 Refresh</button>
            </div>

            <!-- Filters -->
            <div class="toolbar">
                <input type="date" id="dateFrom" class="form-control" 
                       style="width: 200px;" onchange="loadSales()">
                <input type="date" id="dateTo" class="form-control" 
                       style="width: 200px;" onchange="loadSales()">
                <select id="paymentFilter" class="form-control" 
                        style="width: 150px;" onchange="loadSales()">
                    <option value="">All Payments</option>
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                    <option value="insurance">Insurance</option>
                </select>
            </div>

            <!-- Sales Table -->
            <div class="table-container" id="salesContainer">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer"></div>
        </div>
    </main>

    <!-- Sale Details Modal -->
    <div id="saleDetailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Sale Details</h3>
                <button class="close-btn" onclick="closeSaleDetailsModal()">&times;</button>
            </div>
            <div id="saleDetailsContent">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sales.js"></script>
</body>
</html>
